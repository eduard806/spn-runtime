name: bnr-fx-update
# SPN STOICA AI — releul FX: actualizarea zilnică a registrului BNR (EUR).
# BNR publică în jurul orei 13:00 RO; rulăm la 13:30 și 15:30 RO (dublura
# acoperă întârzierile și schimbarea de fus vară/iarnă), plus pornire manuală.
on:
  schedule:
    - cron: "30 10 * * 1-5"   # 13:30 RO vara / 12:30 iarna
    - cron: "30 12 * * 1-5"   # 15:30 RO vara / 14:30 iarna
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Actualizează registrul
        run: python3 tools/update_fx_registry.py
      - name: Commit dacă s-a schimbat
        run: |
          if [ -n "$(git status --porcelain BNR_FX_REGISTRY_LIVE.json)" ]; then
            git config user.name  "spn-fx-relay"
            git config user.email "actions@users.noreply.github.com"
            git add BNR_FX_REGISTRY_LIVE.json
            git commit -m "FX: registrul BNR actualizat ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "Registrul e la zi — fără commit."
          fi
